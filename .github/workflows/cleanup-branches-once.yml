name: Cleanup non-main branches once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/" --jq '.[].ref' |
          sed 's#^refs/heads/##' |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            if [ "$branch" = "main" ]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          done
