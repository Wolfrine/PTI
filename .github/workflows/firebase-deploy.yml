name: Deploy Firebase App and MCP Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            pti-app/package-lock.json
            functions/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd pti-app
          npm install

      - name: Build Angular App
        run: |
          cd pti-app
          npm run build -- --configuration production

      - name: Install Functions Dependencies
        run: npm install --prefix functions

      - name: Build Functions
        run: npm run build --prefix functions

      - name: Configure Functions Runtime Environment
        env:
          PTI_MCP_API_KEYS_VALUE: ${{ secrets.PTI_MCP_API_KEYS }}
        run: |
          if [ -n "$PTI_MCP_API_KEYS_VALUE" ]; then
            printf 'PTI_MCP_API_KEYS=%s\n' "$PTI_MCP_API_KEYS_VALUE" > functions/.env
          else
            echo "PTI_MCP_API_KEYS is not configured; MCP will deploy but reject authenticated calls until the secret is added."
          fi

      - name: Deploy PTI Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; skipping Firebase deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:default --non-interactive

      - name: Deploy Firebase Functions
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; skipping Firebase Functions deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive

      - name: Inspect Velum runtime identity
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          cd functions
          node <<'NODE'
          const {GoogleAuth} = require('google-auth-library');
          (async () => {
            const project = process.env.FIREBASE_PROJECT_ID;
            const auth = new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const client = await auth.getClient();
            const headers = await client.getRequestHeaders();
            const urls = [
              `https://cloudfunctions.googleapis.com/v2/projects/${project}/locations/us-central1/functions`,
              `https://cloudfunctions.googleapis.com/v1/projects/${project}/locations/us-central1/functions`
            ];
            for (const url of urls) {
              const response = await fetch(url, {headers});
              if (!response.ok) continue;
              const data = await response.json();
              const functions = data.functions || [];
              const fn = functions.find(f => String(f.name || '').toLowerCase().endsWith('/velummedia'));
              if (!fn) continue;
              const email = fn.serviceConfig?.serviceAccountEmail || fn.serviceAccountEmail || '';
              console.log(`Velum runtime service account: ${email || 'not exposed'}`);
              console.log(`Velum function resource: ${fn.name}`);
              return;
            }
            throw new Error('Velum runtime identity not found after deployment.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

  deploy_velum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create and deploy Velum secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VELUM_SITE_ID: pti-app-2ab59-velum
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy Velum."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$VELUM_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $VELUM_SITE_ID already exists."
          else
            echo "Creating Hosting site $VELUM_SITE_ID..."
            firebase hosting:sites:create "$VELUM_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:velum --non-interactive
          echo "Velum URL: https://${VELUM_SITE_ID}.web.app"

      - name: Authorize Velum Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VELUM_SITE_ID: pti-app-2ab59-velum
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node velum-gallery/scripts/configure-firebase-auth.mjs
