name: Deploy Firebase App and MCP Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pti-app/package-lock.json
            functions/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd pti-app
          npm install

      - name: Build Angular App
        run: |
          cd pti-app
          npm run build -- --configuration production

      - name: Validate and bundle Morsel
        id: morsel_bundle
        run: |
          node --test food-app/core.test.mjs
          node --check food-app/app.mjs
          before='${{ github.event.before }}'
          visual_changed=true
          if git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$before" "$GITHUB_SHA" -- food-app)"
            visual_changed=false
            while IFS= read -r file; do
              case "$file" in
                ''|food-app/core.mjs|food-app/core.test.mjs|food-app/design/*|food-app/scripts/verify-live.mjs) ;;
                *) visual_changed=true ;;
              esac
            done <<< "$changed"
          fi
          echo "visual_changed=$visual_changed" >> "$GITHUB_OUTPUT"
          mkdir -p pti-app/dist/pti-app/browser/food
          cp food-app/{index.html,styles.css,app.mjs,core.mjs,sample.mjs,phone.html,icon.svg,sw.js,manifest.webmanifest} pti-app/dist/pti-app/browser/food/
          cp -R food-app/assets pti-app/dist/pti-app/browser/food/

      - name: Verify Morsel desktop and mobile interactions
        if: steps.morsel_bundle.outputs.visual_changed == 'true'
        run: |
          npm install --prefix personal-functions --ignore-scripts --no-audit --no-fund
          personal-functions/node_modules/.bin/playwright install --with-deps chromium
          node food-app/scripts/browser-check.mjs
      - name: Save Morsel visual evidence
        if: always() && steps.morsel_bundle.outputs.visual_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morsel-visual-evidence
          path: food-qa/
          retention-days: 7

      - name: Install Functions Dependencies
        run: npm install --prefix functions

      - name: Build Functions
        run: npm run build --prefix functions

      - name: Validate repo-local PTI MCP
        run: |
          npm ci --prefix tools/pti-mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix tools/pti-mcp

      - name: Configure Functions Runtime Environment
        env:
          PTI_MCP_API_KEYS_VALUE: ${{ secrets.PTI_MCP_API_KEYS }}
        run: |
          if [ -n "$PTI_MCP_API_KEYS_VALUE" ]; then
            printf 'PTI_MCP_API_KEYS=%s\n' "$PTI_MCP_API_KEYS_VALUE" > functions/.env
          else
            echo "PTI_MCP_API_KEYS is not configured; MCP will deploy but reject authenticated calls until the secret is added."
          fi

      - name: Deploy PTI Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; skipping Firebase deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version
          npm install --prefix personal-functions --omit=dev --ignore-scripts --no-audit --no-fund
          git show b459b1537ecffd84fef69e35f1017b36317ff76a:personal-harness/firestore.rules > /tmp/pre-food.rules
          APPROVED_PREVIOUS_RULES_FILE=/tmp/pre-food.rules node personal-functions/provision.mjs
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:default --non-interactive
          node food-app/scripts/verify-live.mjs

      - name: Deploy optional Firebase Functions MCP
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PTI_MCP_API_KEYS_VALUE: ${{ secrets.PTI_MCP_API_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; skipping Firebase Functions deploy."
            exit 0
          fi
          if [ -z "$PTI_MCP_API_KEYS_VALUE" ]; then
            echo "PTI_MCP_API_KEYS is absent; skipping optional remote MCP. Repo-local STDIO MCP remains the primary agent path."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive

  deploy_velum:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create and deploy Velum secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VELUM_SITE_ID: pti-app-2ab59-velum
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy Velum."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$VELUM_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $VELUM_SITE_ID already exists."
          else
            echo "Creating Hosting site $VELUM_SITE_ID..."
            firebase hosting:sites:create "$VELUM_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:velum --non-interactive
          echo "Velum URL: https://${VELUM_SITE_ID}.web.app"

      - name: Authorize Velum Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VELUM_SITE_ID: pti-app-2ab59-velum
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node velum-gallery/scripts/configure-firebase-auth.mjs

  deploy_luminary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create and deploy Luminary secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          LUMINARY_SITE_ID: pti-app-2ab59-luminary
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy Luminary."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$LUMINARY_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $LUMINARY_SITE_ID already exists."
          else
            echo "Creating Hosting site $LUMINARY_SITE_ID..."
            firebase hosting:sites:create "$LUMINARY_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:luminary --non-interactive
          echo "Luminary URL: https://${LUMINARY_SITE_ID}.web.app"

      - name: Verify deployed Luminary source and visual assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-luminary.web.app"
          for file in version-loader.js motion-v7.js versions/motion-archive-v7.html versions/motion-archive-v7.css assets/v6-material-mark.webp sw.js; do
            target="$(mktemp)"
            curl --fail --retry 3 --silent --show-error "$origin/$file?release=$GITHUB_SHA" -o "$target"
            cmp "luminary-observer/$file" "$target"
            rm "$target"
          done
          echo "Live Luminary V7 files match commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize Luminary Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          LUMINARY_SITE_ID: pti-app-2ab59-luminary
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node luminary-observer/scripts/configure-firebase-auth.mjs

  deploy_sefpo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate SEFPO static assets
        run: |
          node --input-type=module --check < sefpo-lab/app.js
          node --check sefpo-lab/sw.js

      - name: Create and deploy SEFPO secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          SEFPO_SITE_ID: pti-app-2ab59-sefpo
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy SEFPO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $SEFPO_SITE_ID already exists."
          else
            echo "Creating Hosting site $SEFPO_SITE_ID..."
            firebase hosting:sites:create "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:sefpo --non-interactive
          echo "SEFPO URL: https://$SEFPO_SITE_ID.web.app"

      - name: Verify deployed SEFPO assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-sefpo.web.app"
          for file in index.html app.js styles.css manifest.webmanifest sw.js; do
            matched=false
            for attempt in $(seq 1 18); do
              target="$(mktemp)"
              if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$origin/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$target" && cmp -s "sefpo-lab/$file" "$target"; then
                matched=true
                rm "$target"
                break
              fi
              rm -f "$target"
              sleep 5
            done
            test "$matched" = true
          done

      - name: Authorize SEFPO Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          SEFPO_SITE_ID: pti-app-2ab59-sefpo
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node sefpo-lab/scripts/configure-firebase-auth.mjs
