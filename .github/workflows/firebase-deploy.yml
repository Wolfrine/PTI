name: Deploy Firebase App and MCP Functions

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'wedding-planner/**'
      - 'firebase.wedding*.json'
      - '.github/workflows/wedding.yml'

jobs:
  verify_venture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node --test venture-lab/tests/model.test.mjs venture-lab/tests/store.test.mjs
      - run: npm ci --prefix venture-lab/tests --ignore-scripts --no-audit --no-fund
      - run: npx --yes firebase-tools emulators:exec --only firestore --project demo-venture-tests --config firebase.venture-tests.json 'npm test --prefix venture-lab/tests'

  verify_one_piece:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix apps/one-piece --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix apps/one-piece/companion --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix wedding-planner --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix venture-lab/tests --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix apps/one-piece
      - run: npm test --prefix apps/one-piece/companion
      - run: npm run test:emulator --prefix apps/one-piece
      - name: Verify Atlas owner isolation and atomic history
        run: node apps/one-piece/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-atlas-tests --config firebase.one-piece-tests.json 'node --test personal-harness/tests/atlas.rules.test.mjs'
      - name: Verify private platform usage and Codex Firestore rules
        run: node apps/one-piece/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-codex-usage-tests --config firebase.one-piece-tests.json 'node tools/codex-usage-monitor/test/rules.mjs'
      - name: Verify private Velum jobs and immutable prompts
        run: node apps/one-piece/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-velum-tests --config firebase.one-piece-tests.json 'node --test tools/velum-worker/rules.test.mjs tools/velum-worker/studio2.rules.test.mjs tools/velum-worker/device-isolation.rules.test.mjs'

  deploy:
    needs: [verify_venture, verify_one_piece]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pti-app/package-lock.json
            functions/package-lock.json
            apps/one-piece/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd pti-app
          npm install

      - name: Build Angular App
        run: |
          cd pti-app
          npm run build -- --configuration production

      - name: Test Home, retired routes and local usage monitor
        run: |
          npm test --prefix pti-app -- --watch=false --browsers=ChromeHeadless
          node personal-functions/platform-usage-core.test.mjs
          node --test pti-app/atlas/tests/verify-production.selftest.cjs
          npm ci --prefix tools/codex-usage-monitor --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/codex-usage-monitor
          npm test --prefix tools/local-service-initiator
          node tools/codex-usage-monitor/scripts/check-home-contract.mjs

      - name: Keep old Morsel links working
        run: |
          mkdir -p pti-app/dist/pti-app/browser/food
          cp food-app/legacy-index.html pti-app/dist/pti-app/browser/food/index.html
          cp food-app/legacy-sw.js pti-app/dist/pti-app/browser/food/sw.js

      - name: Build One Piece into the complete default and dedicated Hosting artifacts
        run: |
          npm ci --prefix apps/one-piece --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/one-piece

      - name: Install Functions Dependencies
        run: npm install --prefix functions

      - name: Build Functions
        run: npm run build --prefix functions

      - name: Test One Piece starter gateway
        run: npm run test:one-piece-host --prefix functions

      - name: Validate repo-local PTI MCP
        run: |
          npm ci --prefix tools/pti-mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix tools/pti-mcp

      - name: Configure Functions Runtime Environment
        env:
          PTI_MCP_API_KEYS_VALUE: ${{ secrets.PTI_MCP_API_KEYS }}
        run: |
          if [ -n "$PTI_MCP_API_KEYS_VALUE" ]; then
            printf 'PTI_MCP_API_KEYS=%s\n' "$PTI_MCP_API_KEYS_VALUE" > functions/.env
          else
            echo "PTI_MCP_API_KEYS is not configured; MCP will deploy but reject authenticated calls until the secret is added."
          fi

      - name: Deploy PTI Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is required; cannot deploy PTI or authorize One Piece login."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version
          npm install --prefix personal-functions --omit=dev --ignore-scripts --no-audit --no-fund
          # Last verified production predecessor: CI deploy+Velum both passed
          # for 19bf1725. Preserve exact-hash protection against concurrent edits.
          # No Firestore rules are overwritten if live differs from this revision.
          git show 19bf17252b6036066c6beaa0cf81f243d733af17:personal-harness/firestore.rules > /tmp/pre-platform-usage.rules
          APPROVED_PREVIOUS_RULES_FILE=/tmp/pre-platform-usage.rules node personal-functions/provision.mjs
          # Fail before Hosting/publication unless real client rules isolate usage.
          node tools/codex-usage-monitor/scripts/verify-live-rules.mjs
          node tools/pti-mcp/scripts/verify-atlas-live-rules.mjs

          ONE_PIECE_SITE_ID=pti-app-2ab59-one-piece
          if firebase hosting:sites:get "$ONE_PIECE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $ONE_PIECE_SITE_ID already exists."
          else
            firebase hosting:sites:create "$ONE_PIECE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          # Keep the existing domain list and add only this site's two Firebase aliases.
          # Auth authorization is required, so failures must block this release.
          npm install --no-save --package-lock=false google-auth-library
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {GoogleAuth} from 'google-auth-library';
          const project=process.env.FIREBASE_PROJECT_ID;
          assert.equal(project,'pti-app-2ab59');
          const auth=new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']});
          const client=await auth.getClient();
          const request=async options=>{
            try{return await client.request(options);}
            catch(error){throw new Error(`Firebase Auth configuration request failed (HTTP ${error.response?.status||error.code||'unknown'}).`);}
          };
          const base=`https://identitytoolkit.googleapis.com/admin/v2/projects/${project}/config`;
          const current=await request({url:base});
          const existing=current.data.authorizedDomains||[];
          const required=['pti-app-2ab59-one-piece.web.app','pti-app-2ab59-one-piece.firebaseapp.com'];
          if(required.some(domain=>!existing.includes(domain))){
            await request({url:`${base}?updateMask=authorizedDomains`,method:'PATCH',data:{authorizedDomains:[...new Set([...existing,...required])]}});
          }
          const verified=await request({url:base});
          assert.ok([...existing,...required].every(domain=>verified.data.authorizedDomains.includes(domain)));
          console.log('One Piece Firebase Auth domains authorized; existing domains preserved.');
          NODE

          # One Piece start is a required product function, independent of MCP keys.
          # Accept Firebase's build-image housekeeping prompt for this one
          # explicit function. A missing registry-policy permission is reported
          # by the CLI as a warning; deployment and gateway checks still fail
          # the job on actual product errors. Do not widen the CI identity's IAM.
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:onePieceHost --force --non-interactive
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response=await fetch('https://us-central1-pti-app-2ab59.cloudfunctions.net/onePieceHost/status',{headers:{Origin:'https://pti-app-2ab59.web.app'},signal:AbortSignal.timeout(30000)});
          assert.equal(response.status,401,'One Piece gateway must exist and reject anonymous access');
          assert.equal((await response.json()).error,'authentication_required');
          console.log('One Piece starter gateway deployed with anonymous access denied.');
          NODE
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:default,hosting:one-piece --non-interactive
          node food-app/scripts/verify-legacy.mjs

      - name: Verify dedicated One Piece routes, identity and exact release assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root='pti-app/dist/one-piece-app';
          const origin='https://pti-app-2ab59-one-piece.web.app';
          async function response(resource,options={}){
            let last;
            for(let attempt=1;attempt<=18;attempt++){
              try{
                const result=await fetch(`${origin}${resource}${resource.includes('?')?'&':'?'}release=${process.env.GITHUB_SHA}&attempt=${attempt}`,{...options,headers:{'Cache-Control':'no-cache'}});
                if(result.ok||(options.redirect==='manual'&&result.status===302))return result;
                last=new Error(`${resource}: HTTP ${result.status}`);
              }catch(error){last=error;}
              if(attempt<18)await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw last;
          }
          async function verifyAsset(relative){
            const expected=await fs.readFile(path.join(root,relative));
            for(let attempt=1;attempt<=18;attempt++){
              const actual=await response(`/${relative}`);
              if(Buffer.from(await actual.arrayBuffer()).equals(expected))return;
              if(attempt<18)await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw new Error(`Deployed asset differs: ${relative}`);
          }
          async function files(directory){
            const result=[];
            for(const entry of await fs.readdir(path.join(root,directory),{withFileTypes:true})){
              const relative=`${directory}/${entry.name}`;
              result.push(...(entry.isDirectory()?await files(relative):[relative]));
            }
            return result;
          }
          const redirect=await response('/',{redirect:'manual'});
          assert.equal(redirect.status,302);
          assert.equal(new URL(redirect.headers.get('location'),origin).pathname,'/one-piece/');
          const assets=await files('one-piece');
          for(const asset of assets)await verifyAsset(asset);
          for(const asset of ['index.html','manifest.webmanifest','ngsw-worker.js'])await verifyAsset(asset);
          const login=await response('/login');
          assert.equal(await login.text(),await fs.readFile(path.join(root,'index.html'),'utf8'));
          assert.doesNotMatch(await fs.readFile(path.join(root,'index.html'),'utf8'),/main-[\w-]+\.js|<app-root|rel="manifest"/);
          const manifest=JSON.parse(await (await response('/one-piece/manifest.webmanifest')).text());
          assert.equal(manifest.scope,'/');
          assert.equal(manifest.start_url,'/one-piece/');
          assert.equal(manifest.display,'standalone');
          const legacy=await fetch(`https://pti-app-2ab59.web.app/one-piece/?release=${process.env.GITHUB_SHA}`);
          const alias=await legacy.text();
          assert.equal(alias,await fs.readFile('pti-app/dist/pti-app/browser/one-piece/index.html','utf8'));
          assert.match(alias,/pti-app-2ab59-one-piece\.web\.app/);
          assert.doesNotMatch(alias,/app\.js|rel="manifest"|<app-root/);
          const topLevel=await fs.readdir(root);
          assert.deepEqual(topLevel.sort(),['index.html','manifest.webmanifest','ngsw-worker.js','one-piece']);
          console.log(`Verified one canonical app, redirect-only legacy entry, native-login return and ${assets.length} exact One Piece assets.`);
          NODE

      - name: Verify deployed Atlas source marker and generated asset graph
        run: node pti-app/atlas/tests/verify-production.cjs

      - name: Seed private Development Resources snapshot after verified rules
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PTI_GITHUB_USAGE_TOKEN: ${{ secrets.PTI_GITHUB_USAGE_TOKEN }}
          PTI_FIREBASE_PROJECT_IDS: ${{ vars.PTI_FIREBASE_PROJECT_IDS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node personal-functions/publish-platform-usage.mjs

      - name: Deploy optional Firebase Functions MCP
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PTI_MCP_API_KEYS_VALUE: ${{ secrets.PTI_MCP_API_KEYS }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; skipping Firebase Functions deploy."
            exit 0
          fi
          if [ -z "$PTI_MCP_API_KEYS_VALUE" ]; then
            echo "PTI_MCP_API_KEYS is absent; skipping optional remote MCP. Repo-local STDIO MCP remains the primary agent path."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions:mcp --non-interactive

  deploy_velum:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Velum mobile UX and feed
        run: |
          set -euo pipefail
          node --input-type=module --check < velum-gallery/app.js
          node --check .github/scripts/velum-release.mjs
          node --check velum-gallery/drift-gestures.mjs
          node --check velum-gallery/affection.mjs
          node --check velum-gallery/heart-effects.mjs
          node --check velum-gallery/stats-upgrades.js
          node --check velum-gallery/feed.mjs
          node --check velum-gallery/interaction-upgrades.js
          node --check velum-gallery/sw.js
          node --check velum-gallery/studio.mjs
          node --check velum-gallery/studio-contract.mjs
           node --check velum-gallery/studio-recovery.mjs
          node --check tools/velum-worker/worker.mjs
           node --check tools/velum-worker/recovery.mjs
           node --check tools/velum-worker/recovery-control.mjs
           node --test tools/velum-worker/worker.test.mjs tools/velum-worker/recovery.test.mjs tools/velum-worker/reference.test.mjs tools/velum-worker/thumbnail-backfill.test.mjs
          node --test velum-gallery/tests/*.test.mjs

      - name: Stamp Velum release version into HTML and PWA cache
        run: |
          set -euo pipefail
          node .github/scripts/velum-release.mjs
          node --check velum-gallery/sw.js
          if grep -q '__VELUM_' velum-gallery/index.html velum-gallery/sw.js; then
            echo "::error::Unresolved Velum release placeholder."
            exit 1
          fi

      - name: Verify required Velum Auth, Drive and Picker setup
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VELUM_SITE_ID: pti-app-2ab59-velum
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node velum-gallery/scripts/configure-firebase-auth.mjs

      - name: Create and deploy Velum secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VELUM_SITE_ID: pti-app-2ab59-velum
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy Velum."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$VELUM_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $VELUM_SITE_ID already exists."
          else
            echo "Creating Hosting site $VELUM_SITE_ID..."
            firebase hosting:sites:create "$VELUM_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:velum --non-interactive
          echo "Velum URL: https://${VELUM_SITE_ID}.web.app"

      - name: Verify Velum production assets match this commit
        run: |
          set -euo pipefail
          base="https://pti-app-2ab59-velum.web.app"
          for attempt in 1 2 3 4 5 6; do
            matched=1
            for asset in index.html sw.js app.js bootstrap.js studio.mjs studio-view.mjs studio-archive.mjs studio-reference.mjs studio-drive.mjs studio-contract.mjs device-config.mjs studio.css drift-gestures.mjs affection.mjs heart-effects.mjs interaction-upgrades.js styles.css stats-upgrades.js; do
              output="$RUNNER_TEMP/velum-$(basename "$asset")"
              if ! curl --fail --silent --show-error --location --max-time 20 \
                "$base/$asset?deployment-check=$GITHUB_SHA" -o "$output" \
                || ! cmp -s "$output" "velum-gallery/$asset"; then
                echo "Velum asset not updated yet: $asset (attempt $attempt)"
                matched=0
                break
              fi
            done
            if [ "$matched" -eq 1 ]; then
              echo "Verified: Velum Hosting serves the exact stamped release HTML, service worker and gesture logic."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Velum Hosting did not serve the expected release assets."
          exit 1

  deploy_luminary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create and deploy Luminary secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          LUMINARY_SITE_ID: pti-app-2ab59-luminary
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy Luminary."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$LUMINARY_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $LUMINARY_SITE_ID already exists."
          else
            echo "Creating Hosting site $LUMINARY_SITE_ID..."
            firebase hosting:sites:create "$LUMINARY_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:luminary --non-interactive
          echo "Luminary URL: https://${LUMINARY_SITE_ID}.web.app"

      - name: Verify deployed Luminary source and visual assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-luminary.web.app"
          for file in version-loader.js motion-v7.js versions/motion-archive-v7.html versions/motion-archive-v7.css assets/v6-material-mark.webp sw.js; do
            target="$(mktemp)"
            curl --fail --retry 3 --silent --show-error "$origin/$file?release=$GITHUB_SHA" -o "$target"
            cmp "luminary-observer/$file" "$target"
            rm "$target"
          done
          echo "Live Luminary V7 files match commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Authorize Luminary Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          LUMINARY_SITE_ID: pti-app-2ab59-luminary
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node luminary-observer/scripts/configure-firebase-auth.mjs

  deploy_sefpo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate SEFPO static assets
        run: |
          node --input-type=module --check < sefpo-lab/app.js
          node --check sefpo-lab/sw.js

      - name: Create and deploy SEFPO secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          SEFPO_SITE_ID: pti-app-2ab59-sefpo
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy SEFPO."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $SEFPO_SITE_ID already exists."
          else
            echo "Creating Hosting site $SEFPO_SITE_ID..."
            firebase hosting:sites:create "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:sefpo --non-interactive
          echo "SEFPO URL: https://$SEFPO_SITE_ID.web.app"

      - name: Verify deployed SEFPO assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-sefpo.web.app"
          for file in index.html app.js styles.css manifest.webmanifest sw.js; do
            matched=false
            for attempt in $(seq 1 18); do
              target="$(mktemp)"
              if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$origin/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$target" && cmp -s "sefpo-lab/$file" "$target"; then
                matched=true
                rm "$target"
                break
              fi
              rm -f "$target"
              sleep 5
            done
            test "$matched" = true
          done

      - name: Authorize SEFPO Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          SEFPO_SITE_ID: pti-app-2ab59-sefpo
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node sefpo-lab/scripts/configure-firebase-auth.mjs


  deploy_venture:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Venture Lab static assets
        run: |
          node --input-type=module --check < venture-lab/app.js
          node --input-type=module --check < venture-lab/data.js
          node --check venture-lab/model.mjs
          node --check venture-lab/sample.mjs
          node --check venture-lab/sw.js
          node --check venture-lab/scripts/configure-firebase-auth.mjs

      - name: Create and deploy Venture Lab secondary Hosting site
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VENTURE_SITE_ID: pti-app-2ab59-venture
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured; cannot deploy Venture Lab."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools
          firebase --version

          if firebase hosting:sites:get "$VENTURE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $VENTURE_SITE_ID already exists."
          else
            echo "Creating Hosting site $VENTURE_SITE_ID..."
            firebase hosting:sites:create "$VENTURE_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi

          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:venture --non-interactive
          echo "Venture Lab URL: https://$VENTURE_SITE_ID.web.app"

      - name: Verify deployed Venture Lab assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-venture.web.app"
          for file in index.html app.js data.js model.mjs sample.mjs styles.css manifest.webmanifest sw.js icon.svg; do
            matched=false
            for attempt in $(seq 1 18); do
              target="$(mktemp)"
              if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$origin/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$target" && cmp -s "venture-lab/$file" "$target"; then
                matched=true
                rm "$target"
                break
              fi
              rm -f "$target"
              sleep 5
            done
            test "$matched" = true
          done

      - name: Authorize Venture Lab Firebase Auth domains
        continue-on-error: true
        env:
          FIREBASE_PROJECT_ID: pti-app-2ab59
          VENTURE_SITE_ID: pti-app-2ab59-venture
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install --no-save google-auth-library
          node venture-lab/scripts/configure-firebase-auth.mjs

  cleanup_venture_preview:
    needs: deploy_venture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = 'heads/codex/venture-studio';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            let preview;
            try { preview = (await github.rest.git.getRef({ ...repo, ref })).data; }
            catch (error) { if (error.status === 404) return; throw error; }
            const candidate = (await github.rest.git.getCommit({ ...repo, commit_sha: preview.object.sha })).data;
            const release = (await github.rest.git.getCommit({ ...repo, commit_sha: context.sha })).data;
            if (candidate.tree.sha !== release.tree.sha) {
              core.info('Preview differs from this release; preserve it for ongoing work.');
              return;
            }
            await github.rest.git.deleteRef({ ...repo, ref });
            core.info('Removed the temporary Venture preview branch after verified deployment.');
