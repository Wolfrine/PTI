name: Seed PTI Operating System

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the additive idempotent seed to Firestore
        required: true
        default: false
        type: boolean
  push:
    branches:
      - codex/pti-refoundation
    paths:
      - functions/scripts/seed-operating-system.mjs
      - pti-app/public/data/operating-system-baseline.json
      - .github/workflows/firebase-operating-system-seed.yml

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: pti-app-2ab59
      PTI_OWNER_EMAIL: ${{ secrets.PTI_OWNER_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase Admin dependencies
        run: npm ci --prefix functions

      - name: Configure service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Validate baseline without mutation
        run: node functions/scripts/seed-operating-system.mjs

      - name: Apply baseline
        if: github.event_name == 'workflow_dispatch' && inputs.apply == true
        run: node functions/scripts/seed-operating-system.mjs --apply
