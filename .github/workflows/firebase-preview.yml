name: Deploy PTI Re-foundation Preview

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pti-refoundation
    paths:
      - pti-app/**
      - firebase.json
      - .github/workflows/firebase-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: pti-app-2ab59

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pti-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix pti-app

      - name: Run frontend tests
        run: npm test --prefix pti-app -- --watch=false --browsers=ChromeHeadless

      - name: Build production frontend
        run: npm run build --prefix pti-app -- --configuration production

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS" >> "$GITHUB_ENV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy isolated Hosting preview
        run: |
          npm install --global firebase-tools
          firebase hosting:channel:deploy pti-refoundation \
            --project "$FIREBASE_PROJECT_ID" \
            --expires 14d \
            --non-interactive \
            --json | tee "$RUNNER_TEMP/preview-result.json"

      - name: Publish preview summary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/preview-result.json', 'utf8'));
          const url = result?.result?.['pti-app-2ab59']?.url || result?.result?.url || 'Preview URL was not returned.';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## PTI preview\n\n${url}\n`);
          console.log(`PTI preview: ${url}`);
          NODE
