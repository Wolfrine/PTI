name: Luminary UI Version Verify

on:
  push:
    branches:
      - luminary/intuitive-capture-v3

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static checks
        run: |
          node --check luminary-observer/app.js
          node --check luminary-observer/version-loader.js
          node <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('luminary-observer/version-loader.js','utf8');
          const app=fs.readFileSync('luminary-observer/app.js','utf8');
          const sw=fs.readFileSync('luminary-observer/sw.js','utf8');
          for (const id of ['intuitive-capture-v3','trace-register-v2.1']) {
            if (!loader.includes(id)) throw new Error('Loader missing '+id);
            if (!sw.includes('./versions/'+id+'.html') || !sw.includes('./versions/'+id+'.css')) throw new Error('SW missing '+id);
          }
          if (!loader.includes("LATEST_UI_VERSION = 'intuitive-capture-v3'")) throw new Error('Latest version default incorrect');
          if (!app.includes('setupVersionControls')) throw new Error('Profile version selector missing');
          console.log('Static version contract OK');
          NODE

      - name: Install Playwright
        run: |
          mkdir -p /tmp/luminary-version-test
          cd /tmp/luminary-version-test
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise version switching and PWA cache
        run: |
          python3 -m http.server 4173 --directory luminary-observer >/tmp/luminary-http.log 2>&1 &
          mkdir -p /tmp/luminary-version-test/evidence
          cat >/tmp/luminary-version-test/verify.mjs <<'NODE'
          import { chromium } from 'playwright';

          const appModule = "export function initializeApp(config){return {config};}";
          const authModule = [
            "let listener=null;",
            "const user={uid:'test-user',displayName:'Test Observer',email:'observer@example.com'};",
            "export function getAuth(){return {};}",
            "export class GoogleAuthProvider{}",
            "export function onAuthStateChanged(_auth,cb){listener=cb;queueMicrotask(()=>cb(null));return ()=>{};}",
            "export async function signInWithPopup(){if(listener) await listener(user);return {user};}",
            "export async function signOut(){if(listener) await listener(null);}"
          ].join("\n");

          const observations={
            s3:{sourceType:'text',rawText:'Attention returned after moving rooms.',clientCreatedAtMs:1790230200000,clientCreatedAt:'2026-09-24T00:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s2:{sourceType:'voice',rawText:'A quieter moment after a task switch.',clientCreatedAtMs:1790154000000,clientCreatedAt:'2026-09-23T03:40:00.000Z',localDate:'2026-09-23',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s1:{sourceType:'mark',rawText:'',clientCreatedAtMs:1790067600000,clientCreatedAt:'2026-09-22T03:40:00.000Z',localDate:'2026-09-22',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330}
          };

          const firestoreModule=[
            "const writes=[];globalThis.__luminaryMockWrites=writes;",
            "const observations="+JSON.stringify(observations)+";",
            "export function getFirestore(){return {};}",
            "export function enableIndexedDbPersistence(){return Promise.resolve();}",
            "export function collection(_db,path){return {kind:'collection',path};}",
            "export function doc(_db,path){return {kind:'doc',path};}",
            "export async function addDoc(ref,data){writes.push({op:'addDoc',path:ref.path,data});return {id:'mock-'+writes.length};}",
            "export async function setDoc(ref,data,opts){writes.push({op:'setDoc',path:ref.path,data,opts});}",
            "export function query(source,...args){return {source,args};}",
            "export function orderBy(field,direction){return {type:'orderBy',field,direction};}",
            "export function limit(value){return {type:'limit',value};}",
            "export function serverTimestamp(){return {mockServerTimestamp:true};}",
            "export function increment(value){return {mockIncrement:value};}",
            "export function where(field,op,value){return {type:'where',field,op,value};}",
            "export function documentId(){return '__name__';}",
            "function d(id,data){return {id,data(){return data;}};}",
            "export async function getDocs(q){",
            " const path=q.source?.path||'';",
            " const lookup=(q.args||[]).find(x=>x&&x.type==='where');",
            " if(path.includes('/patterns/items')) return {docs:[",
            "  d('p1',{title:'Attention often returns after a context switch.',summary:'Several observations describe attention becoming clearer after switching environment or task.',status:'observed',supportCount:3,updatedAtMs:3,sourceObservationIds:['s1','s2','s3']}),",
            "  d('p2',{title:'Unlinked recurrence',summary:'This derived record has no source IDs yet.',status:'observed',supportCount:2,updatedAtMs:2})",
            " ]};",
            " if(path.includes('/observations/items')&&lookup){const ids=lookup.value||[];return {docs:ids.filter(id=>observations[id]).map(id=>d(id,observations[id]))};}",
            " if(path.includes('/observations/items')) return {docs:['s3','s2','s1'].map(id=>d(id,observations[id]))};",
            " return {docs:[]};",
            "}"
          ].join("\n");

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          await page.emulateMedia({reducedMotion:'reduce'});
          for (const [url,body] of [
            ['https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js',appModule],
            ['https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js',authModule],
            ['https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js',firestoreModule]
          ]) {
            await page.route(url,route=>route.fulfill({status:200,contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body}));
          }

          async function signIn() {
            await page.getByRole('button',{name:/Start observing|Enter observation/i}).click();
            await page.waitForSelector('#appShell:not([hidden])');
          }

          // New device: latest is default.
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          if(await page.locator('body').getAttribute('data-ui-version')!=='intuitive-capture-v3') throw new Error('New device did not default to latest');
          await page.getByText('Capture first.').waitFor();
          await page.screenshot({path:'/tmp/luminary-version-test/evidence/latest-default-mobile.png',fullPage:true});
          await signIn();

          // Shared capture path records latest UI version.
          await page.getByRole('button',{name:'Mark this moment'}).click();
          await page.waitForFunction(()=>globalThis.__luminaryMockWrites?.some(w=>w.path?.includes('/observations/items')&&w.data?.uiVersion==='intuitive-capture-v3'));

          // V3 patterns are sentence/evidence first.
          await page.locator('.nav-item[data-nav="discover"]:visible').click();
          await page.waitForSelector('.pattern-card');
          if(await page.locator('.pattern-source').count()<3) throw new Error('V3 supporting evidence did not render');
          if(await page.locator('.pattern-track-line').count()!==0) throw new Error('V3 unexpectedly rendered Trace geometry');

          // Switch to previous from Profile.
          await page.locator('#profileBtn').click();
          const selector=page.locator('#experienceVersion');
          if(await selector.inputValue()!=='intuitive-capture-v3') throw new Error('Profile selector not on latest');
          await selector.selectOption('trace-register-v2.1');
          await page.waitForTimeout(800);
          await page.waitForFunction(()=>document.body.dataset.uiVersion==='trace-register-v2.1',{timeout:10000});
          await page.getByText('Notice before meaning.').waitFor();

          // Stored preference survives reload.
          await page.reload({waitUntil:'networkidle'});
          if(await page.locator('body').getAttribute('data-ui-version')!=='trace-register-v2.1') throw new Error('Previous selection did not persist');
          await signIn();
          await page.locator('.nav-item[data-nav="discover"]').first().click();
          await page.waitForSelector('.pattern-track-line');

          // Same Firestore namespace, different UI version telemetry/capture.
          await page.locator('.nav-item[data-nav="observe"]:visible').click();
          await page.getByRole('button',{name:'Mark this moment'}).click();
          await page.waitForFunction(()=>globalThis.__luminaryMockWrites?.some(w=>w.path?.includes('/observations/items')&&w.data?.uiVersion==='trace-register-v2.1'));

          // Switch back to latest.
          await page.locator('#profileBtn').click();
          await page.locator('#experienceVersion').selectOption('intuitive-capture-v3');
          await page.waitForTimeout(800);
          await page.waitForFunction(()=>document.body.dataset.uiVersion==='intuitive-capture-v3',{timeout:10000});

          // PWA cache membership is statically checked above; the same origin and service worker remain shared.
          console.log('Luminary UI version switch verification OK');
          await browser.close();
          NODE
          cd /tmp/luminary-version-test
          node verify.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: luminary-ui-version-evidence
          path: /tmp/luminary-version-test/evidence/*.png
          retention-days: 7
