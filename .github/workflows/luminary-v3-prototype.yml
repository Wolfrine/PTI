name: Luminary V3 Prototype Evidence

on:
  push:
    branches:
      - luminary/intuitive-capture-v3

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render prototype
        run: |
          mkdir -p /tmp/luminary-v3
          cd /tmp/luminary-v3
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE/luminary-observer/design/prototypes" >/tmp/luminary-v3-http.log 2>&1 &
          cat > render.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const out='/tmp/luminary-v3/evidence';
          const fs=await import('fs');
          fs.mkdirSync(out,{recursive:true});
          for (const [name,w,h] of [['desktop',1440,900],['mobile',390,844]]) {
            const page=await browser.newPage({viewport:{width:w,height:h}});
            for (const view of ['entry','observe','patterns']) {
              await page.goto('http://127.0.0.1:4173/v3-intuitive.html?view='+view,{waitUntil:'networkidle'});
              await page.screenshot({path:out+'/'+name+'-'+view+'.png',fullPage:true});
            }
            await page.close();
          }
          await browser.close();
          NODE
          node render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: luminary-v3-intuitive-prototype
          path: /tmp/luminary-v3/evidence/*.png
          retention-days: 7
