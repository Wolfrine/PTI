name: Luminary V5 Runtime Verify

on:
  push:
    branches:
      - luminary/v5-perceptual-specimens

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static checks
        run: |
          node --check luminary-observer/app.js
          node --check luminary-observer/version-loader.js
          node <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('luminary-observer/version-loader.js','utf8');
          const app=fs.readFileSync('luminary-observer/app.js','utf8');
          const html=fs.readFileSync('luminary-observer/versions/perceptual-specimens-v5.html','utf8');
          const sw=fs.readFileSync('luminary-observer/sw.js','utf8');
          if(!loader.includes("LATEST_UI_VERSION = 'perceptual-specimens-v5'")) throw new Error('V5 not latest');
          if(!app.includes("v5SpecimenMarkup")) throw new Error('V5 specimen runtime missing');
          if(!app.includes("perceptualExperience")) throw new Error('V5 mode missing');
          for(const id of ['authGate','appShell','signInBtn','markBtn','voiceBtn','textBtn','timelineList','streamRegister','patternList','patternField','profileDialog','versionControls','momentDialog','momentHero','momentContext','momentNeighbors','momentRelations','toast']){
            if(!html.includes('id="'+id+'"')) throw new Error('V5 missing DOM id '+id);
          }
          if(!sw.includes('./versions/perceptual-specimens-v5.html')||!sw.includes('./versions/perceptual-specimens-v5.css')) throw new Error('V5 missing from PWA cache');
          console.log('Static V5 contract OK');
          NODE

      - name: Install Playwright
        run: |
          mkdir -p /tmp/luminary-v5-runtime
          cd /tmp/luminary-v5-runtime
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise V5 with shared runtime
        run: |
          python3 -m http.server 4173 --directory luminary-observer >/tmp/luminary-v5-http.log 2>&1 &
          cat >/tmp/luminary-v5-runtime/verify.mjs <<'NODE'
          import { chromium } from 'playwright';

          const appModule="export function initializeApp(config){return {config};}";
          const authModule=[
            "let listener=null;",
            "const user={uid:'test-user',displayName:'Test Observer',email:'observer@example.com'};",
            "export function getAuth(){return {};}",
            "export class GoogleAuthProvider{}",
            "export function onAuthStateChanged(_auth,cb){listener=cb;queueMicrotask(()=>cb(null));return ()=>{};}",
            "export async function signInWithPopup(){if(listener) await listener(user);return {user};}",
            "export async function signOut(){if(listener) await listener(null);}"
          ].join("\n");

          const observations={
            s4:{sourceType:'mark',rawText:'',clientCreatedAtMs:1790241000000,clientCreatedAt:'2026-09-24T03:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s3:{sourceType:'text',rawText:'Attention returned after moving rooms.',clientCreatedAtMs:1790230200000,clientCreatedAt:'2026-09-24T00:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s2:{sourceType:'voice',rawText:'A quieter moment after a task switch.',clientCreatedAtMs:1790154000000,clientCreatedAt:'2026-09-23T03:40:00.000Z',localDate:'2026-09-23',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s1:{sourceType:'mark',rawText:'',clientCreatedAtMs:1790067600000,clientCreatedAt:'2026-09-22T03:40:00.000Z',localDate:'2026-09-22',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330}
          };
          const firestoreModule=[
            "const writes=[];globalThis.__luminaryMockWrites=writes;",
            "const observations="+JSON.stringify(observations)+";",
            "export function getFirestore(){return {};}",
            "export function enableIndexedDbPersistence(){return Promise.resolve();}",
            "export function collection(_db,path){return {kind:'collection',path};}",
            "export function doc(_db,path){return {kind:'doc',path};}",
            "export async function addDoc(ref,data){writes.push({op:'addDoc',path:ref.path,data});return {id:'mock-'+writes.length};}",
            "export async function setDoc(ref,data,opts){writes.push({op:'setDoc',path:ref.path,data,opts});}",
            "export function query(source,...args){return {source,args};}",
            "export function orderBy(field,direction){return {type:'orderBy',field,direction};}",
            "export function limit(value){return {type:'limit',value};}",
            "export function serverTimestamp(){return {mockServerTimestamp:true};}",
            "export function increment(value){return {mockIncrement:value};}",
            "export function where(field,op,value){return {type:'where',field,op,value};}",
            "export function documentId(){return '__name__';}",
            "function d(id,data){return {id,data(){return data;}};}",
            "export async function getDocs(q){",
            " const path=q.source?.path||'';",
            " const lookup=(q.args||[]).find(x=>x&&x.type==='where');",
            " if(path.includes('/patterns/items')) return {docs:[",
            "  d('p1',{title:'Attention often returns after a context switch.',summary:'Several observations describe attention becoming clearer after switching environment or task.',status:'observed',supportCount:3,updatedAtMs:3,sourceObservationIds:['s1','s2','s3']}),",
            "  d('p2',{title:'Short marks recur around settling points.',summary:'Several quick marks occur around brief settling points.',status:'observed',supportCount:2,updatedAtMs:2,sourceObservationIds:['s1','s4']})",
            " ]};",
            " if(path.includes('/observations/items')&&lookup){const ids=lookup.value||[];return {docs:ids.filter(id=>observations[id]).map(id=>d(id,observations[id]))};}",
            " if(path.includes('/observations/items')) return {docs:['s4','s3','s2','s1'].map(id=>d(id,observations[id]))};",
            " return {docs:[]};",
            "}"
          ].join("\n");

          const browser=await chromium.launch({headless:true});
          for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            await page.emulateMedia({reducedMotion:'reduce'});
            for(const [url,body] of [
              ['https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js',appModule],
              ['https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js',authModule],
              ['https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js',firestoreModule]
            ]) await page.route(url,route=>route.fulfill({status:200,contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body}));

            await page.goto('http://127.0.0.1:4173/?ui=perceptual-specimens-v5',{waitUntil:'networkidle'});
            if(await page.locator('body').getAttribute('data-ui-version')!=='perceptual-specimens-v5') throw new Error('V5 failed to load');
            if(await page.locator('.entry-specimen-demo .specimen-v5').count()<4) throw new Error('Entry visuals missing');

            await page.getByRole('button',{name:'Enter observation'}).click();
            await page.waitForSelector('#appShell:not([hidden])');
            if(await page.locator('#markSpecimenSeed .specimen-v5').count()!==1) throw new Error('Observe specimen missing');

            await page.getByRole('button',{name:'Mark this moment'}).click();
            await page.waitForFunction(()=>globalThis.__luminaryMockWrites?.some(w=>w.path?.includes('/observations/items')&&w.data?.uiVersion==='perceptual-specimens-v5'));
            await page.waitForSelector('#lastSpecimenSlot .specimen-v5');

            await page.locator('.nav-item[data-nav="timeline"]:visible').click();
            await page.waitForSelector('.timeline-item');
            if(await page.locator('.v5-stream-node .specimen-v5').count()<4) throw new Error('Stream visual field missing');
            if(await page.locator('.timeline-item .specimen-v5').count()<4) throw new Error('Stream list visuals missing');

            await page.locator('.nav-item[data-nav="discover"]:visible').click();
            await page.waitForSelector('.pattern-card');
            if(await page.locator('.v5-pattern-node .specimen-v5').count()<3) throw new Error('Pattern visual field missing');
            await page.locator('.pattern-card[data-pattern-id="p2"]').click();
            await page.waitForTimeout(100);
            if(!(await page.locator('#patternField').innerText()).includes('Short marks recur')) throw new Error('Pattern visual selection did not update');

            await page.locator('.v5-pattern-node[data-observation-id="s1"]').click();
            await page.waitForSelector('#momentDialog[open]');
            if(await page.locator('#momentHero .specimen-v5').count()!==1) throw new Error('Moment specimen missing');
            await page.locator('#closeMomentBtn').click();

            await page.locator('#profileBtn').click();
            const options=await page.locator('#experienceVersion option').allTextContents();
            if(!options.some(x=>x.includes('Perceptual Specimens v5')&&x.includes('Latest'))) throw new Error('Profile does not show V5 Latest');
            if(!options.some(x=>x.includes('Meaningful Motion v4'))) throw new Error('V4 missing');
            if(!options.some(x=>x.includes('Trace Register v2.1'))) throw new Error('V2 missing');
            if(!options.some(x=>x.includes('Intuitive Capture v3'))) throw new Error('V3 missing');
            await page.close();
          }
          await browser.close();
          console.log('Luminary V5 shared-runtime verification OK');
          NODE
          cd /tmp/luminary-v5-runtime
          node verify.mjs
