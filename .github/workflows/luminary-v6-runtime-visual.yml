name: Luminary V6 Runtime Visual Verify

on:
  push:
    branches:
      - luminary/v6-generated-material

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static checks
        run: |
          node --check luminary-observer/app.js
          node --check luminary-observer/version-loader.js
          node <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('luminary-observer/version-loader.js','utf8');
          const sw=fs.readFileSync('luminary-observer/sw.js','utf8');
          const css=fs.readFileSync('luminary-observer/versions/generated-material-v6.css','utf8');
          const html=fs.readFileSync('luminary-observer/versions/generated-material-v6.html','utf8');
          if(!loader.includes("LATEST_UI_VERSION = 'generated-material-v6'")) throw new Error('V6 not latest');
          if(!fs.existsSync('luminary-observer/assets/v6-material-sprite.webp')) throw new Error('Generated sprite missing');
          if(!sw.includes('./assets/v6-material-sprite.webp')) throw new Error('Sprite not cached');
          if(css.includes('v6-material-mark.webp')||css.includes('v6-material-cluster.webp')) throw new Error('Stale V6 asset refs');
          for(const id of ['authGate','appShell','signInBtn','markBtn','voiceBtn','textBtn','timelineList','streamRegister','patternList','patternField','profileDialog','versionControls','momentDialog','momentHero','momentContext','momentNeighbors','momentRelations','toast']){
            if(!html.includes('id="'+id+'"')) throw new Error('Missing '+id);
          }
          console.log('Static V6 contract OK');
          NODE

      - name: Install Playwright
        run: |
          mkdir -p /tmp/luminary-v6
          cd /tmp/luminary-v6
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise V6 and render evidence
        run: |
          python3 -m http.server 4173 --directory luminary-observer >/tmp/luminary-v6-http.log 2>&1 &
          mkdir -p /tmp/luminary-v6/evidence
          cat >/tmp/luminary-v6/verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          const appModule="export function initializeApp(config){return {config};}";
          const authModule=[
            "let listener=null;",
            "const user={uid:'test-user',displayName:'Test Observer',email:'observer@example.com'};",
            "export function getAuth(){return {};}",
            "export class GoogleAuthProvider{}",
            "export function onAuthStateChanged(_auth,cb){listener=cb;queueMicrotask(()=>cb(null));return ()=>{};}",
            "export async function signInWithPopup(){if(listener) await listener(user);return {user};}",
            "export async function signOut(){if(listener) await listener(null);}"
          ].join("\n");

          const observations={
            s8:{sourceType:'mark',rawText:'',clientCreatedAtMs:1790248200000,clientCreatedAt:'2026-09-24T05:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s7:{sourceType:'text',rawText:'There was a quiet gap before starting the next task.',clientCreatedAtMs:1790247600000,clientCreatedAt:'2026-09-24T05:40:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s6:{sourceType:'voice',rawText:'Attention settled after leaving the room.',clientCreatedAtMs:1790241000000,clientCreatedAt:'2026-09-24T03:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s5:{sourceType:'mark',rawText:'',clientCreatedAtMs:1790237400000,clientCreatedAt:'2026-09-24T02:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s4:{sourceType:'text',rawText:'Attention returned after moving rooms.',clientCreatedAtMs:1790230200000,clientCreatedAt:'2026-09-24T00:50:00.000Z',localDate:'2026-09-24',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s3:{sourceType:'voice',rawText:'A quieter moment after a task switch.',clientCreatedAtMs:1790154000000,clientCreatedAt:'2026-09-23T03:40:00.000Z',localDate:'2026-09-23',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s2:{sourceType:'mark',rawText:'',clientCreatedAtMs:1790100000000,clientCreatedAt:'2026-09-22T12:40:00.000Z',localDate:'2026-09-22',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330},
            s1:{sourceType:'text',rawText:'A clearer thought appeared after the walk.',clientCreatedAtMs:1790067600000,clientCreatedAt:'2026-09-22T03:40:00.000Z',localDate:'2026-09-22',timezone:'Asia/Kolkata',timezoneOffsetMinutes:-330}
          };
          const firestoreModule=[
            "const writes=[];globalThis.__luminaryMockWrites=writes;",
            "const observations="+JSON.stringify(observations)+";",
            "export function getFirestore(){return {};}",
            "export function enableIndexedDbPersistence(){return Promise.resolve();}",
            "export function collection(_db,path){return {kind:'collection',path};}",
            "export function doc(_db,path){return {kind:'doc',path};}",
            "export async function addDoc(ref,data){writes.push({op:'addDoc',path:ref.path,data});return {id:'mock-'+writes.length};}",
            "export async function setDoc(ref,data,opts){writes.push({op:'setDoc',path:ref.path,data,opts});}",
            "export function query(source,...args){return {source,args};}",
            "export function orderBy(field,direction){return {type:'orderBy',field,direction};}",
            "export function limit(value){return {type:'limit',value};}",
            "export function serverTimestamp(){return {mockServerTimestamp:true};}",
            "export function increment(value){return {mockIncrement:value};}",
            "export function where(field,op,value){return {type:'where',field,op,value};}",
            "export function documentId(){return '__name__';}",
            "function d(id,data){return {id,data(){return data;}};}",
            "export async function getDocs(q){",
            " const path=q.source?.path||'';",
            " const lookup=(q.args||[]).find(x=>x&&x.type==='where');",
            " if(path.includes('/patterns/items')) return {docs:[",
            "  d('p1',{title:'Attention often returns after a context switch.',summary:'Several observations describe attention becoming clearer shortly after changing environment or task.',status:'observed',supportCount:5,updatedAtMs:3,sourceObservationIds:['s1','s3','s4','s6','s7']}),",
            "  d('p2',{title:'Short marks recur around settling points.',summary:'Quick marks cluster around brief moments of settling rather than extended narrative entries.',status:'observed',supportCount:3,updatedAtMs:2,sourceObservationIds:['s2','s5','s8']})",
            " ]};",
            " if(path.includes('/observations/items')&&lookup){const ids=lookup.value||[];return {docs:ids.filter(id=>observations[id]).map(id=>d(id,observations[id]))};}",
            " if(path.includes('/observations/items')) return {docs:['s8','s7','s6','s5','s4','s3','s2','s1'].map(id=>d(id,observations[id]))};",
            " return {docs:[]};",
            "}"
          ].join("\n");

          const browser=await chromium.launch({headless:true});
          for(const [label,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]) {
            const page=await browser.newPage({viewport});
            for(const [url,body] of [
              ['https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js',appModule],
              ['https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js',authModule],
              ['https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js',firestoreModule]
            ]) await page.route(url,route=>route.fulfill({status:200,contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body}));

            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/?ui=generated-material-v6',{waitUntil:'networkidle'});
            if(await page.locator('body').getAttribute('data-ui-version')!=='generated-material-v6') throw new Error('V6 failed to load');
            await page.screenshot({path:'/tmp/luminary-v6/evidence/'+label+'-entry.png',fullPage:true});

            await page.getByRole('button',{name:/Enter observation/i}).click();
            await page.waitForSelector('#appShell:not([hidden])');
            await page.waitForTimeout(250);
            if(await page.locator('#markSpecimenSeed .material-v6').count()!==1) throw new Error('Observe generated material missing');
            await page.screenshot({path:'/tmp/luminary-v6/evidence/'+label+'-observe.png',fullPage:true});

            await page.getByRole('button',{name:'Mark this moment'}).click();
            await page.waitForFunction(()=>globalThis.__luminaryMockWrites?.some(w=>w.path?.includes('/observations/items')&&w.data?.uiVersion==='generated-material-v6'));
            await page.waitForTimeout(750);
            if(await page.locator('#lastSpecimenSlot .material-v6').count()!==1) throw new Error('Last preserved V6 material missing');

            await page.locator('.nav-item[data-nav="timeline"]:visible').click();
            await page.waitForSelector('.timeline-item');
            if(await page.locator('.v5-stream-node .material-v6').count()<6) throw new Error('Stream generated materials missing');
            await page.screenshot({path:'/tmp/luminary-v6/evidence/'+label+'-stream.png',fullPage:true});

            await page.locator('.nav-item[data-nav="discover"]:visible').click();
            await page.waitForSelector('.pattern-card');
            if(await page.locator('.v5-pattern-node .material-v6').count()<5) throw new Error('Pattern generated materials missing');
            await page.screenshot({path:'/tmp/luminary-v6/evidence/'+label+'-patterns.png',fullPage:true});

            await page.locator('.pattern-card[data-pattern-id="p2"]').click();
            await page.waitForTimeout(180);
            if(!(await page.locator('#patternField').innerText()).includes('Short marks recur')) throw new Error('Pattern selection failed');
            await page.locator('.v5-pattern-node[data-observation-id="s5"]').click();
            await page.waitForSelector('#momentDialog[open]');
            if(await page.locator('#momentHero .material-v6').count()!==1) throw new Error('Moment V6 material missing');
            await page.screenshot({path:'/tmp/luminary-v6/evidence/'+label+'-moment.png',fullPage:true});
            await page.locator('#closeMomentBtn').click();

            await page.locator('#profileBtn').click();
            const options=await page.locator('#experienceVersion option').allTextContents();
            if(!options.some(x=>x.includes('Generated Material v6')&&x.includes('Latest'))) throw new Error('V6 latest missing in Profile');

            if(errors.length) throw new Error('Page errors: '+errors.join(' | '));
            await page.close();
          }
          await browser.close();
          console.log('V6 runtime + visual evidence OK');
          NODE
          cd /tmp/luminary-v6
          node verify.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: luminary-v6-visual-evidence
          path: /tmp/luminary-v6/evidence/*.png
          retention-days: 3
