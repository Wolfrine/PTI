name: Luminary V7 Workbench
on:
  push:
    branches: [luminary/v7-motion]
    paths: [.github/workflows/luminary-v7-workbench.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/luminary-source
          cp -R luminary-observer /tmp/luminary-source/
          cp AGENTS.md firebase.json .firebaserc /tmp/luminary-source/ 2>/dev/null || true
          mkdir -p /tmp/luminary-source/.github
          cp -R .github/workflows /tmp/luminary-source/.github/
          tar czf /tmp/luminary-source.tgz -C /tmp/luminary-source .
      - uses: actions/upload-artifact@v4
        with:
          name: luminary-v7-source
          path: /tmp/luminary-source.tgz
          retention-days: 3
