name: Luminary V7 Workbench
on:
  push:
    branches: [luminary/v7-motion]
    paths: ['.github/v7-payload/**', '.github/workflows/luminary-v7-workbench.yml']
permissions:
  contents: write
concurrency:
  group: luminary-v7-apply
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: luminary/v7-motion
      - name: Apply locally verified application source patch
        run: |
          set -euo pipefail
          if [ ! -f .github/v7-payload/004.b64 ]; then echo 'No pending patch'; exit 0; fi
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          data=''.join(p.read_text().strip() for p in sorted(pathlib.Path('.github/v7-payload').glob('*.b64')))
          patch=gzip.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest()=='a4d313ce81c78fc5d72b7dfb940bc3fc19f9af20571b779b024c286c1269907d'
          pathlib.Path('/tmp/v7.patch').write_bytes(patch)
          PY
          git apply --check --include='luminary-observer/*' /tmp/v7.patch
          git apply --include='luminary-observer/*' /tmp/v7.patch
          node --check luminary-observer/app.js
          node --check luminary-observer/motion-v7.js
          git rm -r .github/v7-payload
          git add luminary-observer
          git -c user.name='Luminary development' -c user.email='development@users.noreply.github.com' commit -m 'feat(luminary): implement V7 motion archive and browser verification'
          git push origin HEAD:luminary/v7-motion
