name: Personal PWA · test and deploy
on:
  push:
    branches: [main]
    paths: ['personal-app/**', 'personal-harness/**', 'personal-functions/**', 'firebase.personal.json', '.github/workflows/personal.yml']
  pull_request:
    paths: ['personal-app/**', 'personal-harness/**', 'personal-functions/**', 'firebase.personal.json', 'sefpo-lab/release-request.json', '.github/workflows/personal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix personal-functions --ignore-scripts
      - run: npm audit --prefix personal-functions --omit=dev --audit-level=high
      - run: node --test personal-harness/core.test.mjs
      - run: node personal-harness/build.mjs
      - run: node --check personal-app/app.mjs && node --check personal-functions/index.cjs && node --check personal-functions/provision.mjs && node --check personal-functions/verify.mjs
      - run: personal-functions/node_modules/.bin/playwright install --with-deps chromium
      - run: node personal-harness/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-browser-evidence
          path: personal-qa/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/pti-personal-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - run: npm install --prefix personal-functions --omit=dev --ignore-scripts && npm install -g firebase-tools@15.31.0
      - run: node personal-harness/build.mjs
      - name: Update reviewed rules on existing default database and preserve Auth domains
        run: node personal-functions/provision.mjs
      - name: Verify real owner-only client access with temporary test users
        run: node personal-functions/verify.mjs
      - name: Enable UI independently of the MCP host
        run: |
          node -e "require('fs').writeFileSync('.personal-dist/runtime-status.json',JSON.stringify({cloudReady:true,database:'(default)',agentReady:false,agentReason:'MCP server connection is pending. The Firebase project is on Spark; no billing upgrade has been made.',verifiedAt:new Date().toISOString()}))"
      - name: Deploy Personal Hosting only
        run: firebase deploy --config firebase.personal.json --project pti-app-2ab59 --only hosting --non-interactive
      - name: Verify live files match this commit
        run: |
          set -euo pipefail
          for file in app.mjs core.mjs boot.mjs sw.js runtime-status.json; do
            matched=false
            for attempt in $(seq 1 24); do
              if curl --fail --retry 2 --max-time 20 --silent --show-error -H 'Cache-Control: no-cache' "https://pti-app-2ab59-personal.web.app/$file?release=$GITHUB_SHA&attempt=$attempt" -o /tmp/personal-live && cmp -s ".personal-dist/$file" /tmp/personal-live; then
                matched=true
                echo "PASS live $file matches this build"
                break
              fi
              echo "Waiting for Hosting propagation: $file, attempt $attempt"
              sleep 5
            done
            if [ "$matched" != true ]; then
              echo "Live file did not converge: $file"
              exit 1
            fi
          done
          node -e "const fs=require('fs'),p='personal-activation-report.json',r=JSON.parse(fs.readFileSync(p));r.hostingVerifiedAt=new Date().toISOString();r.commit=process.env.GITHUB_SHA;r.liveFiles=['app.mjs','core.mjs','boot.mjs','sw.js','runtime-status.json'];fs.writeFileSync(p,JSON.stringify(r,null,2))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-activation-report
          path: personal-activation-report.json
          retention-days: 7
      - name: Remove temporary credential
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  release_sefpo:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/sefpo-release'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: pti-app-2ab59
      SEFPO_SITE_ID: pti-app-2ab59-sefpo
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/pti-sefpo-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate explicit SEFPO release request
        run: |
          node -e "const r=require('./sefpo-lab/release-request.json'); if(r.schemaVersion!==1||r.deploy!==true||!r.requestId) process.exit(1)"
          node --input-type=module --check < sefpo-lab/app.js
      - name: Configure existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Install SEFPO release dependencies
        run: |
          npm install --prefix personal-functions --ignore-scripts --no-audit --no-fund
          npm install -g firebase-tools@15.31.0
          npm install --no-save google-auth-library
      - name: Publish reviewed SEFPO Firestore rules
        env:
          APPROVED_PREVIOUS_RULES_FILE: /tmp/pre-sefpo.rules
        run: |
          set -euo pipefail
          git show ce0a02d4d78d781ba594c076774a99cbf1566bb2:personal-harness/firestore.rules > "$APPROVED_PREVIOUS_RULES_FILE"
          node personal-functions/provision.mjs
      - name: Create and deploy SEFPO Hosting site
        run: |
          set -euo pipefail
          if firebase hosting:sites:get "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $SEFPO_SITE_ID already exists."
          else
            firebase hosting:sites:create "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:sefpo --non-interactive
      - name: Authorize SEFPO Firebase Auth domains
        run: node sefpo-lab/scripts/configure-firebase-auth.mjs
      - name: Verify live SEFPO assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-sefpo.web.app"
          for file in index.html app.js styles.css manifest.webmanifest sw.js; do
            matched=false
            for attempt in $(seq 1 24); do
              target="$(mktemp)"
              if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$origin/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$target" && cmp -s "sefpo-lab/$file" "$target"; then
                matched=true
                rm "$target"
                break
              fi
              rm -f "$target"
              sleep 5
            done
            test "$matched" = true
          done
      - name: Remove temporary credential
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
