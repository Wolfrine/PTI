name: Personal PWA · test and deploy
on:
  push:
    branches: [main]
    paths: ['personal-app/**', 'personal-harness/**', 'personal-functions/**', 'firebase.personal.json', '.github/workflows/personal.yml']
  pull_request:
    paths: ['personal-app/**', 'personal-harness/**', 'personal-functions/**', 'firebase.personal.json', '.github/workflows/personal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix personal-functions --ignore-scripts
      - run: npm audit --prefix personal-functions --omit=dev --audit-level=high
      - run: node --test personal-harness/core.test.mjs
      - run: node personal-harness/build.mjs
      - run: node --check personal-app/app.mjs && node --check personal-functions/index.cjs && node --check personal-functions/provision.mjs && node --check personal-functions/verify.mjs
      - run: personal-functions/node_modules/.bin/playwright install --with-deps chromium
      - run: node personal-harness/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-browser-evidence
          path: personal-qa/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/pti-personal-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure existing deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - run: npm install --prefix personal-functions --omit=dev --ignore-scripts && npm install -g firebase-tools@15.31.0
      - run: node personal-harness/build.mjs
      - name: Update reviewed rules on existing default database and preserve Auth domains
        run: node personal-functions/provision.mjs
      - name: Verify real owner-only client access with temporary test users
        run: node personal-functions/verify.mjs
      - name: Enable UI independently of the MCP host
        run: |
          node -e "require('fs').writeFileSync('.personal-dist/runtime-status.json',JSON.stringify({cloudReady:true,database:'(default)',agentReady:false,agentReason:'MCP server connection is pending. The Firebase project is on Spark; no billing upgrade has been made.',verifiedAt:new Date().toISOString()}))"
      - name: Deploy Personal Hosting only
        run: firebase deploy --config firebase.personal.json --project pti-app-2ab59 --only hosting --non-interactive
      - name: Verify live files match this commit
        run: |
          set -euo pipefail
          for file in app.mjs core.mjs boot.mjs sw.js runtime-status.json; do
            curl --fail --retry 3 --silent --show-error "https://pti-app-2ab59-personal.web.app/$file?release=$GITHUB_SHA" -o /tmp/personal-live
            cmp ".personal-dist/$file" /tmp/personal-live
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-activation-report
          path: personal-activation-report.json
          retention-days: 7
      - name: Remove temporary credential
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
