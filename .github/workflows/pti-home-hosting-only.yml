name: PTI Home - manual Hosting-only release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main-branch commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pti-home-hosting-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@v4

      - name: Verify intended revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            pti-app/package-lock.json
            apps/one-piece/package-lock.json

      - name: Build PTI Home locally in runner
        run: |
          npm ci --prefix pti-app --no-audit --no-fund
          npm run build --prefix pti-app -- --configuration production

      - name: Preserve One Piece default-origin redirect
        run: |
          npm ci --prefix apps/one-piece --ignore-scripts --no-audit --no-fund
          npm run build --prefix apps/one-piece

      - name: Preserve Morsel legacy redirect
        run: |
          mkdir -p pti-app/dist/pti-app/browser/food
          cp food-app/legacy-index.html pti-app/dist/pti-app/browser/food/index.html
          cp food-app/legacy-sw.js pti-app/dist/pti-app/browser/food/sw.js

      - name: Publish default Firebase Hosting only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not configured"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm install -g firebase-tools@15.34.0 --no-audit --no-fund
          firebase deploy --project pti-app-2ab59 --only hosting:default --non-interactive

      - name: Verify exact Living Horizon and sibling redirect assets
        shell: bash
        run: |
          set -euo pipefail
          origin=https://pti-app-2ab59.web.app
          for relative in living-horizon/main.js living-horizon/index.html one-piece/index.html food/index.html; do
            expected="pti-app/dist/pti-app/browser/$relative"
            matched=0
            for attempt in 1 2 3 4 5 6 7 8; do
              actual="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 20 \
                   -H 'Cache-Control: no-cache' \
                   "$origin/$relative?release=$GITHUB_SHA&attempt=$attempt" -o "$actual" \
                 && cmp -s "$actual" "$expected"; then
                matched=1
                rm -f "$actual"
                break
              fi
              rm -f "$actual"
              sleep 4
            done
            if [ "$matched" != 1 ]; then
              echo "::error::Live asset mismatch: $relative"
              exit 1
            fi
          done
          curl --fail --silent --show-error --location --max-time 20 "$origin/home" -o /dev/null
          echo "Verified PTI Home Hosting release $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
