name: PTI shared MCP
on:
  push:
    branches: [main]
    paths: ['tools/pti-mcp/**', 'tools/blinkit-reader/**', 'tools/local-codex/**', 'food-app/core.mjs', 'food-app/intelligence.mjs', 'food-app/places.mjs', 'food-app/blinkit-projection.mjs', 'food-app/firebase-config.mjs', 'personal-harness/core.mjs', '.github/workflows/pti-hosted-mcp.yml']
  pull_request:
    paths: ['tools/pti-mcp/**', 'tools/blinkit-reader/**', 'tools/local-codex/**', 'food-app/core.mjs', 'food-app/intelligence.mjs', 'food-app/places.mjs', 'food-app/blinkit-projection.mjs', 'food-app/firebase-config.mjs', 'personal-harness/core.mjs', '.github/workflows/pti-hosted-mcp.yml']
permissions:
  contents: read
concurrency:
  group: pti-hosted-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      local_codex_only: ${{ steps.scope.outputs.local_codex_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Identify Local Codex-only releases
        id: scope
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git diff --name-only -z "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/pti-release-paths"
          only=true
          seen=false
          while IFS= read -r -d '' file; do
            seen=true
            case "$file" in
              tools/local-codex/*|tools/pti-mcp/src/local-codex*.ts|tools/pti-mcp/scripts/local-codex-*.mjs|tools/pti-mcp/scripts/verify-host.mjs|.github/workflows/pti-hosted-mcp.yml) ;;
              *) only=false ;;
            esac
          done < "$RUNNER_TEMP/pti-release-paths"
          echo "local_codex_only=$([[ $seen == true ]] && echo "$only" || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/pti-mcp/package-lock.json
      - run: npm ci --prefix tools/pti-mcp --ignore-scripts --no-audit --no-fund
      - run: npm run build --prefix tools/pti-mcp && npm test --prefix tools/pti-mcp
      - run: npm ci --prefix tools/blinkit-reader --ignore-scripts --no-audit --no-fund && npm test --prefix tools/blinkit-reader
      - name: Verify Atlas replay safety and canonical app discovery
        run: node --test tools/pti-mcp/scripts/verify-atlas-host.selftest.mjs tools/pti-mcp/scripts/verify-data.selftest.mjs tools/pti-mcp/scripts/configure-native-auth.selftest.mjs tools/pti-mcp/scripts/configure-morsel-auth.selftest.mjs
      - run: npm ci --prefix tools/local-codex --ignore-scripts --no-audit --no-fund && npm run build --prefix tools/local-codex
      - run: node --test personal-harness/core.test.mjs food-app/*.test.mjs
  verify_listener_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix apps/one-piece --ignore-scripts --no-audit --no-fund
      - run: node apps/one-piece/node_modules/firebase-tools/lib/bin/firebase.js emulators:exec --only firestore --project demo-local-codex-listener --config firebase.one-piece-tests.json 'node --test tools/local-codex/test/notification-rules.test.mjs'
  native_auth:
    if: github.event_name == 'push' && github.repository == 'Wolfrine/PTI' && needs.verify.outputs.local_codex_only != 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
      - name: Verify isolated native Firebase Authentication configuration
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
          NATIVE_AUTH_OUTPUT: native-firebase-auth.json
        run: node tools/pti-mcp/scripts/configure-native-auth.mjs
      - name: Repair and verify only the Morsel browser Firebase referrer
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: node tools/pti-mcp/scripts/configure-morsel-auth.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-firebase-auth
          path: native-firebase-auth.json
          retention-days: 7
          if-no-files-found: error
  deploy:
    if: github.event_name == 'push' && github.repository == 'Wolfrine/PTI'
    needs: [verify, verify_listener_rules]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: pti-app-2ab59
      REGION: asia-south1
      SERVICE: pti-firestore-mcp
      PUBLIC_ORIGIN: https://pti-firestore-mcp-185802494856.asia-south1.run.app
      LOCAL_CODEX_ONLY: ${{ needs.verify.outputs.local_codex_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build the host and verify shared app data on shared releases
        run: |
          npm ci --prefix tools/pti-mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix tools/pti-mcp
          if [[ "$LOCAL_CODEX_ONLY" != true ]]; then
            node tools/pti-mcp/scripts/verify-data.mjs
          fi
      - name: Verify Local Codex sign-in prerequisites
        if: env.LOCAL_CODEX_ONLY == 'true'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tools/pti-mcp/scripts/local-codex-release-guard.mjs
      - name: Check existing billing prerequisite without changing it
        run: |
          set -euo pipefail
          enabled="$(gcloud billing projects describe "$PROJECT" --format='value(billingEnabled)')"
          if [ "$enabled" != 'True' ]; then
            echo '::error::PTI has no active billing. Cloud Run deployment requires the owner to enable billing; this workflow never changes the billing plan.'
            exit 1
          fi
      - name: Reuse the existing PTI container repository
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          gcloud artifacts repositories list --project="$PROJECT" --location=all --format=json > /tmp/pti-repositories.json
          node tools/pti-mcp/scripts/check-permissions.mjs /tmp/pti-repositories.json
      - name: Build and push versioned service image
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: |
          set -euo pipefail
          printf '%s' "$ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$IMAGE_HOST"
          docker build -f tools/pti-mcp/Dockerfile -t "$IMAGE_PREFIX/$SERVICE:$GITHUB_SHA" .
          docker push "$IMAGE_PREFIX/$SERVICE:$GITHUB_SHA"
      - name: Register hosted sign-in origin
        if: env.LOCAL_CODEX_ONLY != 'true'
        env:
          ACCESS_TOKEN: '${{ steps.auth.outputs.access_token }}'
        run: node tools/pti-mcp/scripts/prepare-host.mjs
      - name: Deploy account-scoped MCP
        run: |
          set -euo pipefail
          identity="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          gcloud run deploy "$SERVICE" --project="$PROJECT" --region="$REGION" \
            --image="$IMAGE_PREFIX/$SERVICE:$GITHUB_SHA" \
            --service-account="$identity" \
            --set-env-vars="PTI_FIREBASE_PROJECT_ID=$PROJECT,PTI_MCP_PUBLIC_URL=$PUBLIC_ORIGIN,PTI_MCP_ALLOWED_EMAILS=schttewary@gmail.com" \
            --allow-unauthenticated --ingress=all --port=8080 --memory=512Mi --cpu=1 \
            --min-instances=0 --max-instances=2 --concurrency=40 --timeout=120 --quiet
      - name: Verify public connection and authentication boundary
        run: node tools/pti-mcp/scripts/verify-host.mjs
      - name: Redact only this diagnostic task's legacy audit payloads
        if: env.LOCAL_CODEX_ONLY != 'true' && contains(github.event.head_commit.message, '[velum-audit-redaction]')
        run: >-
          node tools/pti-mcp/scripts/redact-velum-diagnostic-audit.mjs --apply
          --job-id diag-clothed-4r-20261105-a747ea-1
          --job-id diag-clothed-4r-20261105-a747ea-2
