name: SEFPO and PTI MCP checks

on:
  pull_request:
    paths:
      - 'sefpo-lab/**'
      - 'tools/pti-mcp/**'
      - 'tools/pti-mcp-runner/**'
      - 'personal-functions/provision.mjs'
      - '.github/workflows/pti-mcp-access.yml'
      - '.github/workflows/sefpo-release.yml'
      - '.codex/config.toml'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
      - '.github/workflows/sefpo-mcp-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate static PWA
        run: |
          node --input-type=module --check < sefpo-lab/app.js
          node --check sefpo-lab/sw.js
          node --check sefpo-lab/scripts/configure-firebase-auth.mjs
          node --check tools/pti-mcp-runner/client.mjs
          node --check personal-functions/provision.mjs
          node -e "JSON.parse(require('fs').readFileSync('firebase.json')); JSON.parse(require('fs').readFileSync('.firebaserc')); JSON.parse(require('fs').readFileSync('sefpo-lab/manifest.webmanifest'))"
      - name: Build repo-local PTI MCP
        run: |
          npm install --prefix tools/pti-mcp --ignore-scripts --no-audit --no-fund
          npm run build --prefix tools/pti-mcp

  release_sefpo:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'codex/sefpo-release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: pti-app-2ab59
      SEFPO_SITE_ID: pti-app-2ab59-sefpo
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate explicit release request
        run: |
          node -e "const r=require('./sefpo-lab/release-request.json'); if(r.schemaVersion!==1||r.deploy!==true||!r.requestId) process.exit(1)"
      - name: Configure existing Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Install release dependencies
        run: |
          npm install --prefix personal-functions --ignore-scripts --no-audit --no-fund
          npm install -g firebase-tools@15.31.0
          npm install --no-save google-auth-library
      - name: Publish reviewed Firestore rules
        env:
          APPROVED_PREVIOUS_RULES_FILE: /tmp/pre-sefpo.rules
        run: |
          set -euo pipefail
          git show ce0a02d4d78d781ba594c076774a99cbf1566bb2:personal-harness/firestore.rules > "$APPROVED_PREVIOUS_RULES_FILE"
          node personal-functions/provision.mjs
      - name: Create and deploy SEFPO Hosting site
        run: |
          set -euo pipefail
          if firebase hosting:sites:get "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive >/dev/null 2>&1; then
            echo "Hosting site $SEFPO_SITE_ID already exists."
          else
            firebase hosting:sites:create "$SEFPO_SITE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive
          fi
          firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting:sefpo --non-interactive
      - name: Authorize SEFPO sign-in domains
        run: node sefpo-lab/scripts/configure-firebase-auth.mjs
      - name: Verify live SEFPO assets
        run: |
          set -euo pipefail
          origin="https://pti-app-2ab59-sefpo.web.app"
          for file in index.html app.js styles.css manifest.webmanifest sw.js; do
            matched=false
            for attempt in $(seq 1 24); do
              target="$(mktemp)"
              if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$origin/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$target" && cmp -s "sefpo-lab/$file" "$target"; then
                matched=true
                rm "$target"
                break
              fi
              rm -f "$target"
              sleep 5
            done
            test "$matched" = true
          done
          echo "SEFPO live deployment and asset verification passed." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credential
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
