name: Venture studio preview
on:
  push:
    branches: [codex/venture-studio]
permissions:
  contents: read
concurrency:
  group: venture-studio-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node --test venture-lab/tests/model.test.mjs venture-lab/tests/store.test.mjs
      - run: npm ci --prefix venture-lab/tests --ignore-scripts --no-audit --no-fund
      - run: npx --yes firebase-tools emulators:exec --only firestore --project demo-venture-tests --config firebase.venture-tests.json 'npm test --prefix venture-lab/tests'
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare public synthetic review surface
        run: |
          mkdir -p venture-lab/review
          cp venture-lab/design/exploration.html venture-lab/review/exploration.html
          cp venture-lab/scripts/review.html venture-lab/review/index.html
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('firebase.json'));for(const h of j.hosting.find(x=>x.target==='venture').headers)for(const v of h.headers)if(v.key==='X-Frame-Options')v.value='SAMEORIGIN';fs.writeFileSync('firebase.json',JSON.stringify(j));"
      - name: Deploy seven-day Firebase preview
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools hosting:channel:deploy venture-studio --only venture --expires 7d --project pti-app-2ab59 --non-interactive --json > preview.json
          node -e "const r=require('./preview.json'); console.log(JSON.stringify(r.result));" >> "$GITHUB_STEP_SUMMARY"
          cat preview.json
      - name: Verify published preview assets
        run: |
          origin="$(node -p "Object.values(require('./preview.json').result)[0].url")"
          for file in index.html app.js styles.css data.js model.mjs; do
            matched=false
            for attempt in $(seq 1 12); do
              target="$(mktemp)"
              if curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$origin/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$target" && cmp -s "venture-lab/$file" "$target"; then
                matched=true
                rm "$target"
                break
              fi
              rm -f "$target"
              sleep 3
            done
            test "$matched" = true
          done
