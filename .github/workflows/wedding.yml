name: Wedding · verify and release
on:
  push:
    branches: [main, codex/wedding-home]
    paths: ['wedding-planner/**', 'personal-harness/firestore.rules', 'firebase.wedding*.json', '.firebaserc', '.github/workflows/wedding.yml']
  pull_request:
    paths: ['wedding-planner/**', 'personal-harness/firestore.rules', 'firebase.wedding*.json', '.firebaserc', '.github/workflows/wedding.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wedding-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/pti-wedding-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wedding-planner/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix wedding-planner --no-audit --no-fund
      - run: npm test --prefix wedding-planner
      - run: npm run build --prefix wedding-planner
      - run: npm audit --prefix wedding-planner --omit=dev --audit-level=high
      - run: npm ci --prefix venture-lab/tests --ignore-scripts --no-audit --no-fund
      - name: Verify family access and existing Venture boundaries on the shared rules
        run: npx --yes firebase-tools@15.31.0 emulators:exec --only firestore --project demo-wedding-tests --config firebase.wedding-tests.json 'npm run test:rules --prefix wedding-planner && npm test --prefix venture-lab/tests'
      - run: npx --prefix wedding-planner playwright install --with-deps chromium
      - run: npm install --prefix personal-functions --ignore-scripts --no-audit --no-fund
      - name: Verify active sessions, competing edits and complete exports on emulators
        run: npx --yes firebase-tools@15.31.0 emulators:exec --only firestore,auth --project demo-wedding-tests --config firebase.wedding-tests.json 'node wedding-planner/tests/store-browser.mjs'
      - name: Verify the rendered invitation and family workflows
        run: node wedding-planner/tests/browser.mjs
      - name: Verify sharing metadata and canonical invitation sharing
        run: node wedding-planner/tests/sharing-browser.mjs
      - name: Verify complete illustrated menus, uncertainty and comparison
        working-directory: wedding-planner
        run: node --import tsx tests/illustrated-browser.mjs
      - name: Verify public-only offline installation and safe waiting updates
        run: node wedding-planner/tests/pwa-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          include-hidden-files: true
          name: wedding-browser-evidence
          path: .wedding-qa/
          retention-days: 14
      # Release the exact verified build without depending on artifact storage quota.
      - name: Use existing PTI deployment identity
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Protect and initialize the existing wedding workspace
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node wedding-planner/scripts/provision.mjs
      - name: Check live client authorization with temporary synthetic accounts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node wedding-planner/scripts/verify-cloud.mjs
      - name: Release only the wedding Hosting target
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx --yes firebase-tools@15.31.0 deploy --project pti-app-2ab59 --config firebase.wedding.json --only hosting:wedding --non-interactive
      - name: Verify the hosted build and private source boundary
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node wedding-planner/scripts/verify-hosting.mjs https://mahima-mayank.web.app
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: wedding-activation-report
          path: wedding-activation-report.json
          retention-days: 14
      - name: Print activation evidence
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          for report in wedding-activation-report.json .wedding-qa/cloud.json .wedding-qa/hosting.json; do
            if test -f "$report"; then cat "$report"; fi
          done
      - name: Remove temporary deployment credential
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
