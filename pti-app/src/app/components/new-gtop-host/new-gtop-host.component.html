<section *ngIf="reading.status !== 'hidden'" class="host-panel" [class.has-start-action]="reading.service?.canStart || requestingStart" aria-labelledby="gtop-host-title">
  <div class="host-identity">
    <span class="host-icon" aria-hidden="true"><mat-icon>school</mat-icon></span>
    <div class="host-copy">
      <div class="host-heading"><h2 id="gtop-host-title">GT Papers assistant</h2><span class="host-status" [attr.data-tone]="presentation.tone" role="status">{{ presentation.label }}</span></div>
      <p [class.is-important]="presentation.tone === 'warning' || reading.service?.state === 'starting'" [title]="presentation.detail">{{ presentation.detail }}</p>
      <p *ngIf="error" class="host-error" role="alert">{{ error }}</p>
    </div>
  </div>
  <div class="host-actions">
    <button *ngIf="reading.service?.canStart || requestingStart" class="host-start" type="button" [disabled]="!canStart" (click)="start()" aria-label="Start GT Papers assistant">{{ requestingStart ? 'Requesting…' : 'Start' }}</button>
    <button class="host-refresh" type="button" [disabled]="busy" (click)="refresh()" aria-label="Refresh GT Papers assistant status" title="Refresh status"><mat-icon aria-hidden="true">refresh</mat-icon></button>
    <a href="https://gtop-question-papers.web.app/" target="_blank" rel="noopener noreferrer" aria-label="Open GT Papers" title="Open GT Papers">Open <mat-icon aria-hidden="true">north_east</mat-icon></a>
  </div>
</section>
