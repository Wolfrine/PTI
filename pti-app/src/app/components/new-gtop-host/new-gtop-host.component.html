<section *ngIf="reading.status !== 'hidden'" class="host-panel" aria-labelledby="gtop-host-title">
  <div class="host-copy"><div class="host-heading"><h2 id="gtop-host-title">GT Papers assistant</h2><span class="host-status" [attr.data-tone]="presentation.tone" role="status">{{ presentation.label }}</span></div><p>{{ presentation.detail }}</p><p *ngIf="error" class="host-error" role="alert">{{ error }}</p></div>
  <div class="host-actions"><button *ngIf="reading.service?.canStart || requestingStart" class="host-start" type="button" [disabled]="!canStart" (click)="start()">{{ requestingStart ? 'Requesting…' : 'Start assistant' }}</button><button *ngIf="reading.service?.state === 'starting' && !requestingStart" class="host-start" type="button" disabled>Waiting for connection</button><button class="host-refresh" type="button" [disabled]="busy" (click)="refresh()" aria-label="Refresh GT Papers assistant status">Refresh</button><a href="https://gtop-question-papers.web.app/" target="_blank" rel="noopener noreferrer">Open GT Papers <span aria-hidden="true">↗</span></a></div>
</section>
