<section *ngIf="reading.status !== 'hidden'" class="host-panel" aria-labelledby="one-piece-host-title">
  <div class="host-copy">
    <div class="host-heading"><h2 id="one-piece-host-title">One Piece home PC</h2><span class="host-status" [attr.data-tone]="presentation.tone" role="status">{{ presentation.label }}</span></div>
    <p>{{ presentation.detail }}</p>
    <p *ngIf="error" class="host-error" role="alert">{{ error }}</p>
  </div>
  <div class="host-actions">
    <button *ngIf="reading.service?.canStart || requestingStart" class="host-start" type="button" [disabled]="!canStart" (click)="start()">{{ requestingStart ? 'Requesting…' : 'Start One Piece' }}</button>
    <button *ngIf="reading.service?.state === 'starting' && !requestingStart" class="host-start" type="button" disabled>Waiting for connection</button>
    <button class="host-refresh" type="button" [disabled]="busy" (click)="refresh()" aria-label="Refresh One Piece home PC status">Refresh</button>
    <a href="https://pti-app-2ab59-one-piece.web.app/" target="_blank" rel="noopener noreferrer">Open One Piece <span aria-hidden="true">↗</span></a>
  </div>
</section>
