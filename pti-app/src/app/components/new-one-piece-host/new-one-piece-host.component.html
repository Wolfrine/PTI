<section *ngIf="reading.status !== 'hidden'" class="host-panel" [class.has-start-action]="reading.service?.canStart || requestingStart" aria-labelledby="one-piece-host-title">
  <div class="host-identity">
    <span class="host-icon" aria-hidden="true"><mat-icon>smart_display</mat-icon></span>
    <div class="host-copy">
      <div class="host-heading"><h2 id="one-piece-host-title">One Piece home PC</h2><span class="host-status" [attr.data-tone]="presentation.tone" role="status">{{ presentation.label }}</span></div>
      <p [class.is-important]="presentation.tone === 'warning' || reading.service?.state === 'starting'" [title]="presentation.detail">{{ presentation.detail }}</p>
      <p *ngIf="error" class="host-error" role="alert">{{ error }}</p>
    </div>
  </div>
  <div class="host-actions">
    <button *ngIf="reading.service?.canStart || requestingStart" class="host-start" type="button" [disabled]="!canStart" (click)="start()" aria-label="Start One Piece">{{ requestingStart ? 'Requesting…' : 'Start' }}</button>
    <button class="host-refresh" type="button" [disabled]="busy" (click)="refresh()" aria-label="Refresh One Piece home PC status" title="Refresh status"><mat-icon aria-hidden="true">refresh</mat-icon></button>
    <a href="https://pti-app-2ab59-one-piece.web.app/" target="_blank" rel="noopener noreferrer" aria-label="Open One Piece" title="Open One Piece">Open <mat-icon aria-hidden="true">north_east</mat-icon></a>
  </div>
</section>
